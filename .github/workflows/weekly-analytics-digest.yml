name: Weekly Portfolio Analytics Digest

on:
  schedule:
    # Runs every Monday at 09:00 AM UTC (14:30 IST)
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode without sending real email'
        required: true
        type: boolean
        default: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate & Send Analytics Report
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: 'portfolio-web'
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_RECIPIENT_EMAIL: ${{ secrets.REPORT_RECIPIENT_EMAIL }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            pnpm run report:dry-run
          else
            pnpm run report
          fi
